# jsherp-boot + jsherp-web；MySQL / Redis：共享基础设施（如 /opt/infra，网络 infra_default）
#
# 构建前本机须已有：jshERP-boot/target/jshERP.jar、jshERP-web/dist
# 构建：docker compose build jsherp-boot jsherp-web  或  .\build-push.ps1
# 服务器：./server-deploy.sh

services:
  jsherp-boot:
    image: ${REGISTRY_PREFIX:-local}/jsherp-boot:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        JRE_RUNTIME_IMAGE: ${JRE_RUNTIME_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:8-jre-alpine}
    container_name: jsherp-boot
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${EXTERNAL_MYSQL_HOST:-shared-mysql}:${EXTERNAL_MYSQL_PORT:-3306}/${MYSQL_DATABASE:-jsh_erp}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${EXTERNAL_MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-shared-redis}
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jsherp-upload:/data/upload
    entrypoint:
      - java
      - -Dfile.path=/data/upload
      - -Dserver.tomcat.basedir=/tmp/tomcat
      - -Djava.awt.headless=true
      - -jar
      - /app/app.jar
    expose:
      - "9999"
    networks:
      - default
      - infra_default

  jsherp-web:
    image: ${REGISTRY_PREFIX:-local}/jsherp-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-docker.m.daocloud.io/library/nginx:1.25-alpine}
        NGINX_CONF: ${NGINX_CONF:-deploy/docker/nginx/default.conf}
    container_name: jsherp-web
    restart: unless-stopped
    depends_on:
      - jsherp-boot
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  jsherp-upload:

networks:
  infra_default:
    external: true
