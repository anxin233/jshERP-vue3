# 可选叠加：后端加入「已有 MySQL 容器」所在的 Docker 网络（无需 docker network connect）
#
# 用法（按需改下方 networks.legacy_mysql_net.name 为 docker network ls 中的网络名）：
#   docker compose -f docker-compose.external-mysql.yml -f docker-compose.server.yml \
#     -f overrides/mysql-external-docker-network.yml up -d
#
# MySQL 端口映射、宿主机 Nginx 等见 patch-tianranqi-mysql-port.sh、nginx/host-nginx-erp.example.conf

services:
  jsherp-boot:
    networks:
      - default
      - legacy_mysql_net

networks:
  legacy_mysql_net:
    external: true
    name: tianranqi_default
