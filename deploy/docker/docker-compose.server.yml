# 与 docker-compose.yml 合并：去掉 build，仅 pull；并限制内存、收紧 JVM（适合 2G 内存小机）
# 服务器：docker compose -f docker-compose.yml -f docker-compose.server.yml pull && docker compose -f docker-compose.yml -f docker-compose.server.yml up -d

services:
  jsherp-boot:
    build: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  jsherp-web:
    build: !reset null
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
