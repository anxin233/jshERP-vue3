# 通配符证书：_.aicode.ccwu.cc.pem / _.aicode.ccwu.cc.key
# Harbor：https://harbor.aicode.ccwu.cc（勿在主域 / 使用 Harbor）
# 主域 / 占位，可改为 root / 反代其它业务

# HTTP：主域 + Harbor 子域 统一跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aicode.ccwu.cc www.aicode.ccwu.cc harbor.aicode.ccwu.cc;
    return 301 https://$host$request_uri;
}

# HTTPS：主域（ERP、tianranqi 等；根路径不占 Harbor）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aicode.ccwu.cc www.aicode.ccwu.cc;

    ssl_certificate     /etc/nginx/ssl/aicode.ccwu.cc/_.aicode.ccwu.cc.pem;
    ssl_certificate_key /etc/nginx/ssl/aicode.ccwu.cc/_.aicode.ccwu.cc.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /trq {
        return 302 /trq/;
    }

    location /trq/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /vite.svg {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 业务 Spring（非 Harbor；Harbor Registry API 在 harbor. 子域）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 0;
    }

    location = /erp {
        return 302 /erp/;
    }

    location /erp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # 主域根路径占位（可改为 root / 或反代你的业务）
    location = / {
        default_type text/plain;
        return 200 'aicode.ccwu.cc\n';
    }

    location / {
        default_type text/plain;
        return 404 'not found\n';
    }
}

# HTTPS：Harbor 专用子域
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harbor.aicode.ccwu.cc;

    ssl_certificate     /etc/nginx/ssl/aicode.ccwu.cc/_.aicode.ccwu.cc.pem;
    ssl_certificate_key /etc/nginx/ssl/aicode.ccwu.cc/_.aicode.ccwu.cc.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        client_max_body_size 0;
    }
}
