# 前端使用 VUE_APP_PUBLIC_PATH=/erp/ 构建时：
# 静态资源在 /usr/share/nginx/html/，浏览器请求路径为 /erp/js/...、/erp/index.html
server {
    listen 80;
    server_name _;

    # 前端 SPA（alias 指向 dist 根目录，与 Vue publicPath=/erp/ 一致）
    location /erp/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /erp/index.html;
    }

    # 可选：根路径重定向到 /erp/
    location = / {
        return 302 /erp/;
    }

    # API：须与前端 VUE_APP_API_BASE、index 中默认逻辑一致（/erp/jshERP-boot）
    location /erp/jshERP-boot/ {
        proxy_pass http://jsherp-boot:9999/jshERP-boot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
}
