# 不含 MySQL：Redis + jsherp-boot + jsherp-web，连已有 MySQL（.env 设 EXTERNAL_MYSQL_HOST 等）。
# MySQL 在别的 compose 网络里、要用容器名访问时，再叠一层 overrides/mysql-external-docker-network.yml（见 overrides/README.md）。
# 构建：docker compose -f docker-compose.external-mysql.yml build jsherp-boot jsherp-web
# 服务器只拉：同上文件再 -f docker-compose.server.yml。DaoCloud 等见 docker-compose.yml 顶部。

services:
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: jsherp-redis
    restart: unless-stopped
    command: redis-server
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - jsherp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jsherp-boot:
    image: ${REGISTRY_PREFIX:-local}/jsherp-boot:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: ${DOCKERFILE_BACKEND:-deploy/docker/Dockerfile.backend}
      args:
        MAVEN_BUILD_IMAGE: ${MAVEN_BUILD_IMAGE:-docker.m.daocloud.io/library/maven:3.9-eclipse-temurin-8}
        JRE_RUNTIME_IMAGE: ${JRE_RUNTIME_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:8-jre-alpine}
    container_name: jsherp-boot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${EXTERNAL_MYSQL_HOST:-host.docker.internal}:${EXTERNAL_MYSQL_PORT:-3306}/${MYSQL_DATABASE:-jsh_erp}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${EXTERNAL_MYSQL_USER:-root}
      # 填写已有 MySQL 上该用户的密码（.env 里可与 MYSQL_ROOT_PASSWORD 相同或另设）
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jsherp-upload:/data/upload
    entrypoint:
      - java
      - -Dfile.path=/data/upload
      - -Dserver.tomcat.basedir=/tmp/tomcat
      - -Djava.awt.headless=true
      - -jar
      - /app/app.jar
    expose:
      - "9999"

  jsherp-web:
    image: ${REGISTRY_PREFIX:-local}/jsherp-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: ${DOCKERFILE_FRONTEND:-deploy/docker/Dockerfile.frontend}
      args:
        VUE_APP_PUBLIC_PATH: ${VUE_APP_PUBLIC_PATH:-/}
        VUE_APP_API_BASE: ${VUE_APP_API_BASE:-}
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-docker.m.daocloud.io/library/nginx:1.25-alpine}
    container_name: jsherp-web
    restart: unless-stopped
    depends_on:
      - jsherp-boot
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  jsherp-redis-data:
  jsherp-upload:
